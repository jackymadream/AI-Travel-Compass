services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: travel-compass-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PORT: "8000"
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://frontend:3000
      LOG_LEVEL: INFO
      # Optional: point at a Redis sidecar/host if available
      # REDIS_URL: redis://redis:6379/0
    volumes:
      # Mount GCP credentials if path in .env is relative/local
      - ./credentials:/app/credentials:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/liveness', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # Browser calls API on the host-mapped port
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: travel-compass-web
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:3000/explore",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    restart: unless-stopped

  # Optional local Redis — enable with: docker compose --profile cache up
  redis:
    image: redis:7-alpine
    profiles: ["cache"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
